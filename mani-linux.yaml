# Linux VM config (where the AYON server runs): the server tasks of mani.yaml, same names, bash shell.
# Select it with `mani -c mani-linux.yaml run <task>` (e.g. `alias mani='mani -c ~/AYON/mani-linux.yaml'` in ~/.bashrc),
# or make it the default with `mani run to-linux` (swaps the files, see the README), undone by `to-win` below.
# Do NOT rely on MANI_CONFIG: mani ignores it when a mani.yaml is in the current folder or a parent, so it would
# load the Windows mani.yaml, whose `shell:` does not exist on Linux, and every task prints only its header.
# The tasks are duplicated from mani.yaml on purpose; when you change one, change it in both (not to-linux/to-win).
shell: bash -c

env:
  SSL_CERT: ""
  DOCKER_REPO: ayon-docker

# Repos that are not cloned are skipped instead of failing the run.
specs:
  default:
    ignore_non_existing: true

projects:
  workbench:
    desc: "This repo itself (the workbench root). Workbench-level tasks run here."
    path: .
  ayon-docker:
    desc: "Docker compose setup for running an AYON server"
    url: https://github.com/ynput/ayon-docker.git
    path: ayon-docker
    tags: [server, essential]
  Kitsu-for-Docker:
    desc: "Local Kitsu server in Docker (used for Kitsu addon testing)"
    url: https://github.com/EmberLightVFX/Kitsu-for-Docker.git
    path: extras/Kitsu-for-Docker
    tags: [kitsu, docker]

tasks:
  docker-clone:
    desc: "git clone https://github.com/ynput/$DOCKER_REPO.git (default ayon-docker; skipped if the folder exists). Usage: mani run docker-clone [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    cmd: |
      if [ -d "$DOCKER_REPO" ]; then
        echo "$DOCKER_REPO already exists, skipping clone"
      else
        git clone "https://github.com/ynput/$DOCKER_REPO.git"
      fi

  server-update:
    desc: "docker compose pull + up --build in $DOCKER_REPO (default ayon-docker). Usage: mani run server-update [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose pull && docker compose up -d --build

  server-restart:
    desc: "docker compose restart in $DOCKER_REPO (default ayon-docker). Usage: mani run server-restart [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose restart

  server-rebuild:
    desc: "docker compose up --build (no pull) in $DOCKER_REPO (default ayon-docker). Usage: mani run server-rebuild [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose up -d --build

  server-log:
    desc: "Dump the last 1000 log lines of $SERVICE (default server) in $DOCKER_REPO (default ayon-docker) to tmp/${DOCKER_REPO}_$SERVICE.log. Usage: mani run server-log [DOCKER_REPO=<repo>] [SERVICE=<service>]"
    env:
      SERVICE: server
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose logs -t -n 1000 "$SERVICE" > "../tmp/${DOCKER_REPO}_$SERVICE.log" 2>&1

  server-log-live:
    desc: "Follow the log of $SERVICE (default server) in $DOCKER_REPO (default ayon-docker). Usage: mani run server-log-live [DOCKER_REPO=<repo>] [SERVICE=<service>]"
    env:
      SERVICE: server
    target:
      projects: [workbench]
    tty: true
    cmd: |
      cd "$DOCKER_REPO"
      docker compose logs -f -t -n 10 "$SERVICE"

  server-release:
    desc: "Print the RELEASE file of the server running from $DOCKER_REPO (default ayon-docker). Usage: mani run server-release [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose exec server cat RELEASE

  server-prune:
    desc: "DESTRUCTIVE. docker image prune -a (removes all unused images, asks for confirmation)"
    target:
      projects: [workbench]
    tty: true
    cmd: docker image prune -a

  frontend-live:
    desc: "Run the frontend dev server from $DOCKER_REPO/server/ayon-frontend (default ayon-docker; clone it there and check out the right branch first). Usage: mani run frontend-live [DOCKER_REPO=<repo>]"
    target:
      projects: [workbench]
    tty: true
    cmd: |
      cd "$DOCKER_REPO/server/ayon-frontend"
      yarn install && yarn dev --host 0.0.0.0

  project-backup:
    desc: "Dump project $PROJECT to SQL with sudo make in $DOCKER_REPO (default ayon-docker). Usage: mani run project-backup PROJECT=<name> [DOCKER_REPO=<repo>]"
    env:
      PROJECT: demo_Commercial
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      sudo make dump projectname="$PROJECT"

  project-restore:
    desc: "Restore project $PROJECT from dump.$PROJECT.sql with sudo make in $DOCKER_REPO (default ayon-docker). Usage: mani run project-restore PROJECT=<name> [DOCKER_REPO=<repo>]"
    env:
      PROJECT: demo_Commercial
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      sudo make restore projectname="$PROJECT" "dump.$PROJECT.sql"

  kitsu-update:
    desc: Pull + rebuild my local Kitsu server (extras/Kitsu-for-Docker)
    target:
      projects: [Kitsu-for-Docker]
    cmd: docker compose pull && docker compose up -d --build

  # ---------------------------------------------------------------- Undo `mani run to-linux` (defined in mani.yaml)
  # Not duplicated in mani.yaml on purpose. Run it before `git pull`, then `mani run to-linux` again.
  to-win:
    desc: "LINUX VM ONLY. mani.yaml -> mani-linux.yaml and mani-win.yaml -> mani.yaml. Run before git pull"
    target:
      projects: [workbench]
    cmd: |
      [ -f mani-win.yaml ] || { echo "mani-win.yaml not found, not swapped"; exit 1; }
      [ ! -e mani-linux.yaml ] || { echo "mani-linux.yaml already exists, not swapped?"; exit 1; }
      mv mani.yaml mani-linux.yaml
      mv mani-win.yaml mani.yaml
      echo "Done: mani.yaml is the Windows config again (the Linux one is mani-linux.yaml)."
