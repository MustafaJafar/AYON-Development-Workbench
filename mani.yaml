# Workspace manifest. `mani sync` clones every project listed here.
# Tags (set by hand; used to browse and relate repos, e.g. `mani list projects --tags houdini`).
# A tag is only kept if it groups repos or is a filter, so a tag that just repeats a repo's own name is not used.
#   kind      addon (an AYON addon) | utility (helper tool, plugin or library) | server (server component) | api |
#             app | example | test | ci | docs | reference (read it to learn from it)
#   tier      essential (minimum for running an AYON server with a pipeline)
#   category  3d | 2d-draw | 2d-comp: addons for 3D apps | drawing/painting apps | compositing, editorial and review apps
#   topic     what repos relate to: an app or service (houdini = ayon-houdini + HuskStandaloneSubmitter +
#             houdini_PRTROP; kitsu = ayon-kitsu + Kitsu-for-Docker; also nuke, unreal, usd, deadline), a function
#             (prod-track: production trackers; farm-manager; media-player; pipeline), docker, frontend
#   optional  kept for reference only: `sync: false`, so `mani sync` and default tasks skip it;
#             clone with `mani sync -p <repo> --ignore-sync-state`, run tasks on it with `-p <repo>`
# Tasks are further down; see `mani describe tasks`.

# Tasks need Git Bash. mani's default shell on Windows is PowerShell, and a plain `bash` can resolve to WSL's.
# 8.3 path because mani splits this string on spaces. The Linux VM uses mani-linux.yaml instead.
shell: C:/PROGRA~1/Git/usr/bin/bash.exe -c

# DOCKER_REPO: the docker repo the server-* tasks work on (ayon-docker unless overridden).
# Optional on server-facing tasks: SSL_CERT=<path to CA bundle> (e.g. for a local self-signed ayon-docker).
# When set, SSL_CERT_FILE and REQUESTS_CA_BUNDLE are exported to the task, see scripts/local-ssl.sh.
env:
  SSL_CERT: ""
  DOCKER_REPO: ayon-docker

# Repos that are not cloned are skipped instead of failing the run.
specs:
  default:
    ignore_non_existing: true

