tasks:
  # ---------------------------------------------------------------- Git (any repo)
  status:
    desc: Short git status + current branch
    target:
      tags_expr: "!optional"
    cmd: git status -sb

  remotes:
    desc: List git remotes
    target:
      tags_expr: "!optional"
    cmd: git remote -v

  update-default:
    desc: Checkout the default branch (main/develop/..., from origin/HEAD) and pull it; skips dirty repos
    target:
      tags_expr: "!optional"
    cmd: |
      if [ -n "$(git status --porcelain)" ]; then echo "dirty, skipped"; exit 0; fi
      git remote set-head origin --auto >/dev/null 2>&1
      branch=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#^origin/##')
      echo "default branch: $branch"
      git checkout "$branch" && git pull origin "$branch"

  update-branch:
    desc: "Checkout + pull a branch. Usage: mani run update-branch -p <repo> BRANCH=develop"
    env:
      BRANCH: develop
    cmd: git checkout "$BRANCH" && git pull origin "$BRANCH"

  submodules:
    desc: Init/update submodules (mani sync does not use --recurse-submodules)
    target:
      tags_expr: "!optional"
    cmd: git submodule update --init --recursive

  add-remote:
    desc: "Add a fork as a remote. Usage: mani run add-remote -p <repo> REMOTE=<github-user>"
    env:
      REMOTE: MustafaJafar
    cmd: |
      repo=$(basename "$PWD")
      git remote add "$REMOTE" "https://github.com/$REMOTE/$repo.git" && echo "Remote '$REMOTE' added to $repo"

  tag-latest:
    desc: "Detach HEAD on the most recent tag (handy for addons with services). Usage: mani run tag-latest -p <repo>"
    cmd: |
      git fetch origin --tags
      tag=$(git describe --tags --abbrev=0)
      echo "Most recent tag is: $tag"
      git checkout "tags/$tag"

  tag-checkout:
    desc: "Detach HEAD on a tag. Usage: mani run tag-checkout -p <repo> TAG=1.2.3"
    env:
      TAG: ""
    cmd: |
      [ -n "$TAG" ] || { echo "TAG is required"; exit 1; }
      git fetch origin "$TAG" && git checkout FETCH_HEAD

  # ---------------------------------------------------------------- Python tooling
  ruff-check:
    desc: "Ruff check. Usage: mani run ruff-check -p <repo> [FILE=path] (empty FILE = whole repo)"
    env:
      FILE: ""
    cmd: ruff check $FILE

  ruff-fix:
    desc: "Ruff check --fix. Usage: mani run ruff-fix -p <repo> [FILE=path] (empty FILE = whole repo)"
    env:
      FILE: ""
    cmd: ruff check --fix $FILE

  jupyter:
    desc: Launch Jupyter notebook in tmp/jupyter
    target:
      projects: [workbench]
    tty: true
    cmd: |
      mkdir -p tmp/jupyter
      cd tmp/jupyter && jupyter notebook

  # ---------------------------------------------------------------- Addons: zip + upload to my server
  # Needs scripts/.env (AYON_SERVER_URL, AYON_API_KEY) and uv (`uv run` creates the venv in scripts on first use)
  # (see scripts/setup-my-dev-env.ps1).
  addon-package:
    desc: "Create an addon package zip into tmp/packages. Usage: mani run addon-package -p <repo>"
    cmd: python create_package.py -o ../tmp/packages

  addon-upload:
    desc: "Create an addon package and upload it. Usage: mani run addon-upload -p <repo>"
    cmd: |
      . ../scripts/local-ssl.sh
      python create_package.py
      addon="$(pwd -W 2>/dev/null || pwd)"
      cd ../scripts && uv run python upload-addon.py --addon "$addon"

  addons-upload-all:
    desc: Clear tmp/packages, package my usual addons (the `-p` list below), upload them all
    target:
      projects: [workbench]
    cmd: |
      . scripts/local-ssl.sh
      rm -rf tmp/packages && mkdir -p tmp/packages
      mani run addon-package -p ayon-third-party,ayon-ocio,ayon-applications,ayon-core,ayon-traypublisher,ayon-blender,ayon-deadline,ayon-houdini,ayon-maya,ayon-nuke,ayon-usd
      pkg="$(pwd -W 2>/dev/null || pwd)/tmp/packages"
      cd scripts && uv run python upload-addon.py --package-dir "$pkg"

  # ---------------------------------------------------------------- AYON server (docker)
  # These run from the workbench root against DOCKER_REPO (default ayon-docker): mani run server-update DOCKER_REPO=<repo>
  server-update:
    desc: "docker compose pull + up --build. Usage: mani run server-update [DOCKER_REPO=ayon-docker]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose pull && docker compose up -d --build

  server-restart:
    desc: "docker compose restart. Usage: mani run server-restart [DOCKER_REPO=ayon-docker]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose restart

  server-rebuild:
    desc: "docker compose up --build (no pull). Usage: mani run server-rebuild [DOCKER_REPO=ayon-docker]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose up -d --build

  server-log:
    desc: "Dump the last 1000 log lines of a compose service to tmp/<DOCKER_REPO>_<SERVICE>.log. Usage: mani run server-log [DOCKER_REPO=ayon-docker] [SERVICE=server]"
    env:
      SERVICE: server
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose logs -t -n 1000 "$SERVICE" > "../tmp/${DOCKER_REPO}_$SERVICE.log" 2>&1

  server-log-live:
    desc: "Follow the log of a compose service. Usage: mani run server-log-live [DOCKER_REPO=ayon-docker] [SERVICE=server]"
    env:
      SERVICE: server
    target:
      projects: [workbench]
    tty: true
    cmd: |
      cd "$DOCKER_REPO"
      docker compose logs -f -t -n 10 "$SERVICE"

  server-release:
    desc: "Print the RELEASE file of the running server. Usage: mani run server-release [DOCKER_REPO=ayon-docker]"
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      docker compose exec server cat RELEASE

  server-prune:
    desc: "DESTRUCTIVE. docker image prune -a (removes all unused images, asks for confirmation)"
    target:
      projects: [workbench]
    tty: true
    cmd: docker image prune -a

  frontend-live:
    desc: "Run the frontend dev server. Expects ayon-frontend cloned in <DOCKER_REPO>/server and already on the right branch. Usage: mani run frontend-live [DOCKER_REPO=ayon-docker]"
    target:
      projects: [workbench]
    tty: true
    cmd: |
      cd "$DOCKER_REPO/server/ayon-frontend"
      yarn install && yarn dev --host 0.0.0.0

  project-backup:
    desc: "Dump a project to SQL (sudo). Usage: mani run project-backup PROJECT=demo_Commercial [DOCKER_REPO=ayon-docker]"
    env:
      PROJECT: demo_Commercial
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      sudo make dump projectname="$PROJECT"

  project-restore:
    desc: "Restore a project from dump.<PROJECT>.sql (sudo). Usage: mani run project-restore PROJECT=demo_Commercial [DOCKER_REPO=ayon-docker]"
    env:
      PROJECT: demo_Commercial
    target:
      projects: [workbench]
    cmd: |
      cd "$DOCKER_REPO"
      sudo make restore projectname="$PROJECT" "dump.$PROJECT.sql"

  kitsu-update:
    desc: Pull + rebuild my local Kitsu server (extras/Kitsu-for-Docker)
    target:
      projects: [Kitsu-for-Docker]
    cmd: docker compose pull && docker compose up -d --build

  # ---------------------------------------------------------------- Documentation
  docs-init:
    desc: Install yarn + docusaurus for ayon-documentation (first time only)
    target:
      projects: [ayon-documentation]
    cmd: |
      cd website
      npm install -g yarn && yarn add docusaurus --dev

  docs-run:
    desc: Serve ayon-documentation locally on :3000 (clears the .docusaurus cache first)
    target:
      projects: [ayon-documentation]
    tty: true
    cmd: |
      cd website
      rm -rf .docusaurus
      yarn start

  docs-online:
    desc: Expose localhost:3000 temporarily via ngrok
    target:
      projects: [workbench]
    tty: true
    cmd: ngrok http 3000

  # ---------------------------------------------------------------- Launcher
  launcher-env:
    desc: Create the launcher venv and install runtime dependencies
    target:
      projects: [ayon-launcher]
    cmd: |
      pwsh tools/manage.ps1 create-env
      pwsh tools/manage.ps1 install-runtime-dependencies

  launcher-build-upload:
    desc: Build the installer and upload it (AYON_SERVER_URL / AYON_API_KEY come from scripts/.env)
    target:
      projects: [ayon-launcher]
    cmd: |
      . ../scripts/local-ssl.sh
      while IFS='=' read -r k v; do
        [ -n "$v" ] && export "$k=$v"
      done < <(tr -d '\r' < ../scripts/.env)
      pwsh -NoProfile -Command 'tools/manage.ps1 --build-make-installer --force' &&
      pwsh -NoProfile -Command 'tools/manage.ps1 upload --server $env:AYON_SERVER_URL --api-key $env:AYON_API_KEY --force'

  launcher-prod:
    desc: Run the launcher from code, production bundle
    target:
      projects: [ayon-launcher]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh -NoProfile -Command "tools/ayon_console.bat"

  launcher-staging:
    desc: Run the launcher from code, staging bundle
    target:
      projects: [ayon-launcher]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh -NoProfile -Command "tools/ayon_console.bat --use-staging"

  launcher-dev:
    desc: Run the launcher from code, dev bundle
    target:
      projects: [ayon-launcher]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh -NoProfile -Command "tools/ayon_console.bat --use-dev"

  publish-report-viewer:
    desc: Launch the publish report viewer (dev bundle)
    target:
      projects: [ayon-launcher]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh -NoProfile -Command "tools/ayon_console.bat --use-dev publish-report-viewer"

  traypublisher-dev:
    desc: Launch Tray Publisher (dev bundle)
    target:
      projects: [ayon-launcher]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh -NoProfile -Command "tools/ayon_console.bat --use-dev addon traypublisher launch"

  # ---------------------------------------------------------------- Addon env / dependency packages
  core-env:
    desc: Create the ayon-core venv (tools/manage.ps1 create-env)
    target:
      projects: [ayon-core]
    cmd: pwsh tools/manage.ps1 create-env

  deptool-install:
    desc: Install ayon-dependencies-tool (copies scripts/.env into it first)
    target:
      projects: [ayon-dependencies-tool]
    cmd: |
      cp ../scripts/.env .env
      pwsh start.ps1 install

  deptool-create:
    desc: "Create a dependency package WITHOUT uploading. Usage: mani run deptool-create BUNDLE=AYON-Dev OUTPUT_DIR=<path>"
    env:
      BUNDLE: AYON-Dev
      OUTPUT_DIR: ../tmp/packages
    target:
      projects: [ayon-dependencies-tool]
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh start.ps1 create -b "$BUNDLE" --skip-upload --output-dir "$OUTPUT_DIR"

  deptool-create-upload:
    desc: "Create a dependency package and upload it. Usage: mani run deptool-create-upload BUNDLE=AYON-Dev OUTPUT_DIR=<path>"
    env:
      BUNDLE: AYON-Dev
      OUTPUT_DIR: ../tmp/packages
    target:
      projects: [ayon-dependencies-tool]
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh start.ps1 create -b "$BUNDLE" --output-dir "$OUTPUT_DIR"

  # ---------------------------------------------------------------- Addon services (run from code)
  # BUNDLE is the bundle variant the service connects as. The *-install tasks copy scripts/.env in.
  shotgrid-install:
    desc: Install ShotGrid service tools (copies scripts/.env first)
    target:
      projects: [ayon-shotgrid]
    cmd: |
      cp ../scripts/.env service_tools/.env
      pwsh service_tools/manage.ps1 create-env

  shotgrid-services:
    desc: Run all ShotGrid services (uses extras/cacert.pem as SHOTGUN_API_CACERTS)
    target:
      projects: [ayon-shotgrid]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      export SHOTGUN_API_CACERTS="$(cd ../extras && pwd -W)/cacert.pem"
      cd service_tools && pwsh ./manage.ps1 services

  shotgrid-leecher:
    desc: "Run the ShotGrid leecher. Usage: mani run shotgrid-leecher BUNDLE=AYON-Dev"
    env:
      BUNDLE: AYON-Dev
    target:
      projects: [ayon-shotgrid]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh service_tools/manage.ps1 leecher --variant "$BUNDLE"

  shotgrid-processor:
    desc: "Run the ShotGrid processor. Usage: mani run shotgrid-processor BUNDLE=AYON-Dev"
    env:
      BUNDLE: AYON-Dev
    target:
      projects: [ayon-shotgrid]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh service_tools/manage.ps1 processor --variant "$BUNDLE"

  ftrack-install:
    desc: Install ftrack service tools (copies scripts/.env first)
    target:
      projects: [ayon-ftrack]
    cmd: |
      cp ../scripts/.env service_tools/.env
      pwsh service_tools/manage.ps1 install

  ftrack-services:
    desc: "Run all ftrack services. Usage: mani run ftrack-services BUNDLE=AYON-Dev"
    env:
      BUNDLE: AYON-Dev
    target:
      projects: [ayon-ftrack]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh service_tools/manage.ps1 services --variant "$BUNDLE"

  ftrack-leecher:
    desc: "Run the ftrack leecher. Usage: mani run ftrack-leecher BUNDLE=AYON-Dev"
    env:
      BUNDLE: AYON-Dev
    target:
      projects: [ayon-ftrack]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh service_tools/manage.ps1 leecher --variant "$BUNDLE"

  ftrack-processor:
    desc: "Run the ftrack processor. Usage: mani run ftrack-processor BUNDLE=AYON-Dev"
    env:
      BUNDLE: AYON-Dev
    target:
      projects: [ayon-ftrack]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      pwsh service_tools/manage.ps1 processor --variant "$BUNDLE"

  kitsu-processor-install:
    desc: Install the Kitsu processor service (still poetry, its manage.ps1 requires it; copies scripts/.env first)
    target:
      projects: [ayon-kitsu]
    cmd: |
      cp ../scripts/.env services/processor/.env
      cd services/processor && poetry install --no-root

  kitsu-processor:
    desc: Run the Kitsu processor service from code
    target:
      projects: [ayon-kitsu]
    tty: true
    cmd: |
      . ../scripts/local-ssl.sh
      # ayon_api.init_service() expects these two to resolve the service context.
      export AYON_ADDON_NAME=kitsu
      export AYON_ADDON_VERSION=$(python -c 'content={}; exec(open("package.py").read(), content); print(content["version"])')
      cd services/processor && pwsh ./manage.ps1 run
